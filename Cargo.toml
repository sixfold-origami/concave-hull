[workspace]
resolver = "2"
members = ["cli", "crates/concave_hull", "crates/concave_hull_f64"]

[workspace.lints]
rust.unexpected_cfgs = { level = "warn", check-cfg = [
	'cfg(feature, values("f32", "f64"))',
] }

[workspace.dependencies]
nalgebra = "0.33.2"
parry2d = "0.21.1"
parry2d-f64 = "0.21.1"
criterion = { version = "0.5", features = ["html_reports"] }
csv = "1.3.1"

[profile.release]
codegen-units = 1
lto = 'fat'
